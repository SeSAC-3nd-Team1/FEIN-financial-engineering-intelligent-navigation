name: Raw Monthly Legacy Cleanup

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-monthly-cleanup.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: raw-monthly-legacy-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Delete verified legacy Raw blobs
        working-directory: data
        run: python scripts/cleanup_legacy_raw_blobs.py
