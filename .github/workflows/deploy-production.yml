name: Deploy production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
          BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
          ACS_EMAIL_SENDER_ADDRESS: ${{ vars.ACS_EMAIL_SENDER_ADDRESS }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT: ${{ vars.AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT }}
          AZURE_OPENAI_REBALANCING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_REBALANCING_DEPLOYMENT }}
          AZURE_OPENAI_COMPARISON_DEPLOYMENT: ${{ vars.AZURE_OPENAI_COMPARISON_DEPLOYMENT }}
          AZURE_OPENAI_CHATBOT_ENDPOINT: ${{ vars.AZURE_OPENAI_CHATBOT_ENDPOINT }}
          AZURE_OPENAI_CHATBOT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHATBOT_DEPLOYMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          EMAIL_OTP_SECRET: ${{ secrets.EMAIL_OTP_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_CHATBOT_API_KEY: ${{ secrets.AZURE_OPENAI_CHATBOT_API_KEY }}
        run: |
          set -euo pipefail

          required=(
            ACR_NAME
            AZURE_RESOURCE_GROUP
            FRONTEND_APP_NAME
            BACKEND_APP_NAME
            ACS_EMAIL_SENDER_ADDRESS
            AZURE_OPENAI_ENDPOINT
            AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT
            AZURE_OPENAI_REBALANCING_DEPLOYMENT
            AZURE_OPENAI_COMPARISON_DEPLOYMENT
            AZURE_OPENAI_CHATBOT_ENDPOINT
            AZURE_OPENAI_CHATBOT_DEPLOYMENT
            DATABASE_URL
            REDIS_URL
            JWT_SECRET
            ACS_EMAIL_CONNECTION_STRING
            EMAIL_OTP_SECRET
            KIS_APP_KEY
            KIS_APP_SECRET
            NAVER_API_HUB_CLIENT_ID
            NAVER_API_HUB_CLIENT_SECRET
            AZURE_OPENAI_API_KEY
            AZURE_OPENAI_CHATBOT_API_KEY
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build frontend image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}"

      - name: Build backend image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}" \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}"

      - name: Deploy frontend Container App
        run: |
          az containerapp update \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}"

      - name: Resolve production frontend origin
        id: frontend-origin
        run: |
          set -euo pipefail
          frontend_fqdn="$(az containerapp show \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          if [[ -z "${frontend_fqdn}" ]]; then
            echo "Frontend Container App ingress FQDN is missing." >&2
            exit 1
          fi

          echo "origin=https://${frontend_fqdn}" >> "${GITHUB_OUTPUT}"

      - name: Sync backend Container App secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          EMAIL_OTP_SECRET: ${{ secrets.EMAIL_OTP_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_CHATBOT_API_KEY: ${{ secrets.AZURE_OPENAI_CHATBOT_API_KEY }}
        run: |
          set -euo pipefail

          az containerapp secret set \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --secrets \
              database-url="${DATABASE_URL}" \
              redis-url="${REDIS_URL}" \
              jwt-secret="${JWT_SECRET}" \
              acs-email-connection-string="${ACS_EMAIL_CONNECTION_STRING}" \
              email-otp-secret="${EMAIL_OTP_SECRET}" \
              kis-app-key="${KIS_APP_KEY}" \
              kis-app-secret="${KIS_APP_SECRET}" \
              naver-api-hub-client-id="${NAVER_API_HUB_CLIENT_ID}" \
              naver-api-hub-client-secret="${NAVER_API_HUB_CLIENT_SECRET}" \
              azure-openai-api-key="${AZURE_OPENAI_API_KEY}" \
              azure-openai-chatbot-api-key="${AZURE_OPENAI_CHATBOT_API_KEY}"

      - name: Deploy backend Container App with production configuration
        env:
          FRONTEND_ORIGIN: ${{ steps.frontend-origin.outputs.origin }}
          ACS_EMAIL_SENDER_ADDRESS: ${{ vars.ACS_EMAIL_SENDER_ADDRESS }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT: ${{ vars.AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT }}
          AZURE_OPENAI_REBALANCING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_REBALANCING_DEPLOYMENT }}
          AZURE_OPENAI_COMPARISON_DEPLOYMENT: ${{ vars.AZURE_OPENAI_COMPARISON_DEPLOYMENT }}
          AZURE_OPENAI_CHATBOT_ENDPOINT: ${{ vars.AZURE_OPENAI_CHATBOT_ENDPOINT }}
          AZURE_OPENAI_CHATBOT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHATBOT_DEPLOYMENT }}
        run: |
          set -euo pipefail

          az containerapp update \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}" \
            --set-env-vars \
              DATABASE_URL=secretref:database-url \
              DB_CONNECT_TIMEOUT_SECONDS=5 \
              REDIS_URL=secretref:redis-url \
              JWT_SECRET=secretref:jwt-secret \
              ACCESS_TOKEN_MINUTES=60 \
              CORS_ORIGINS="${FRONTEND_ORIGIN}" \
              ACS_EMAIL_CONNECTION_STRING=secretref:acs-email-connection-string \
              ACS_EMAIL_SENDER_ADDRESS="${ACS_EMAIL_SENDER_ADDRESS}" \
              EMAIL_OTP_SECRET=secretref:email-otp-secret \
              EMAIL_OTP_TTL_SECONDS=300 \
              EMAIL_OTP_MAX_ATTEMPTS=5 \
              EMAIL_OTP_RESEND_SECONDS=60 \
              EMAIL_OTP_HOURLY_LIMIT=5 \
              EMAIL_OTP_IP_HOURLY_LIMIT=20 \
              EMAIL_VERIFICATION_TOKEN_TTL_SECONDS=1800 \
              KIS_APP_KEY=secretref:kis-app-key \
              KIS_APP_SECRET=secretref:kis-app-secret \
              KIS_BASE_URL=https://openapi.koreainvestment.com:9443 \
              KIS_WEBSOCKET_URL=ws://ops.koreainvestment.com:21000 \
              KIS_TIMEOUT_SECONDS=3 \
              KIS_REST_PAGE_INTERVAL_SECONDS=0.5 \
              PRICE_CACHE_TTL_SECONDS=5 \
              MINUTE_CANDLE_CACHE_TTL_SECONDS=15 \
              REALTIME_PRICE_CACHE_TTL_SECONDS=30 \
              REALTIME_PRICE_STALE_SECONDS=10 \
              KIS_REALTIME_RECONNECT_MAX_SECONDS=30 \
              KIS_REALTIME_CLIENT_QUEUE_SIZE=100 \
              KIS_REALTIME_MAX_SYMBOLS_PER_CLIENT=20 \
              NAVER_API_HUB_CLIENT_ID=secretref:naver-api-hub-client-id \
              NAVER_API_HUB_CLIENT_SECRET=secretref:naver-api-hub-client-secret \
              NAVER_NEWS_BASE_URL=https://naverapihub.apigw.ntruss.com \
              NEWS_SEARCH_QUERY=증시 \
              NEWS_CACHE_TTL_SECONDS=300 \
              NEWS_REQUEST_TIMEOUT_SECONDS=5 \
              AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT}" \
              AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key \
              AZURE_OPENAI_API_VERSION=2024-10-21 \
              AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT="${AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT}" \
              AI_RECOMMENDATION_TIMEOUT_SECONDS=15 \
              AI_RECOMMENDATION_MODEL_VERSION=strategy-recommender-v1 \
              AI_RECOMMENDATION_PROMPT_VERSION=v1 \
              AI_RECOMMENDATION_DATASET_VERSION=financial-8y-v1 \
              AZURE_OPENAI_REBALANCING_DEPLOYMENT="${AZURE_OPENAI_REBALANCING_DEPLOYMENT}" \
              AI_REBALANCING_TIMEOUT_SECONDS=15 \
              AI_REBALANCING_MODEL_VERSION=rebalancing-v1 \
              AZURE_OPENAI_COMPARISON_DEPLOYMENT="${AZURE_OPENAI_COMPARISON_DEPLOYMENT}" \
              AI_COMPARISON_TIMEOUT_SECONDS=15 \
              AI_COMPARISON_MODEL_VERSION=portfolio-comparison-v1 \
              STRATEGY_CATALOG_VERSION=v2 \
              AZURE_OPENAI_CHATBOT_ENDPOINT="${AZURE_OPENAI_CHATBOT_ENDPOINT}" \
              AZURE_OPENAI_CHATBOT_API_KEY=secretref:azure-openai-chatbot-api-key \
              AZURE_OPENAI_CHATBOT_DEPLOYMENT="${AZURE_OPENAI_CHATBOT_DEPLOYMENT}" \
              AZURE_OPENAI_CHATBOT_API_VERSION=2024-10-21 \
              AI_CHATBOT_TIMEOUT_SECONDS=30 \
              AI_CHATBOT_MODEL_VERSION=chatbot-v1 \
              AI_CHATBOT_PROMPT_VERSION=v1 \
              AI_CHATBOT_RATE_LIMIT_PER_MINUTE=30 \
              AI_CHATBOT_RATE_LIMIT_WINDOW_SECONDS=60

      - name: Verify deployed Container App revisions
        run: |
          set -euo pipefail

          frontend_revision="$(az containerapp show \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          backend_revision="$(az containerapp show \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.latestReadyRevisionName \
            --output tsv)"

          if [[ -z "${frontend_revision}" || -z "${backend_revision}" ]]; then
            echo "A Container App does not have a ready production revision." >&2
            exit 1
          fi

          echo "Frontend ready revision: ${frontend_revision}"
          echo "Backend ready revision: ${backend_revision}"
