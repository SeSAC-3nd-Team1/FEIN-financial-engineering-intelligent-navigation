name: Deploy production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build frontend image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}"

      - name: Build backend image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}" \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}"

      - name: Deploy frontend Container App
        run: |
          az containerapp update \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/fein-frontend:${IMAGE_TAG}"

      - name: Deploy backend Container App
        run: |
          az containerapp update \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/fein-backend:${IMAGE_TAG}"
