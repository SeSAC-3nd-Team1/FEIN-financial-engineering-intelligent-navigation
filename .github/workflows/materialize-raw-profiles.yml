name: Materialize Raw Profiles

on:
  push:
    branches:
      - docs/35-raw-profile-artifacts
    paths:
      - .github/workflows/materialize-raw-profiles.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Raw profile artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/reports/raw-profile /tmp/raw-profiles
          declare -A ARTIFACTS=(
            [disclosure]=9259851547
            [financial_statement]=9259847324
            [market_index]=9259820069
            [security_product]=9259890096
            [stock_dividend]=9259829442
            [stock_issuance]=9259911631
            [stock_master]=9259885961
            [stock_price]=9259929116
          )
          for dataset in "${!ARTIFACTS[@]}"; do
            artifact_id="${ARTIFACTS[$dataset]}"
            echo "Downloading ${dataset} artifact=${artifact_id}"
            gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "/tmp/raw-profiles/${dataset}.zip"
            unzip -oq "/tmp/raw-profiles/${dataset}.zip" -d data/reports/raw-profile
          done

      - name: Build index and verify profile totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/reports/raw-profile")
          datasets = [
              "disclosure",
              "financial_statement",
              "market_index",
              "security_product",
              "stock_dividend",
              "stock_issuance",
              "stock_master",
              "stock_price",
          ]
          profiles = []
          for dataset in datasets:
              json_path = root / f"{dataset}.json"
              md_path = root / f"{dataset}.md"
              if not json_path.is_file() or not md_path.is_file():
                  raise SystemExit(f"missing profile files for {dataset}")
              with json_path.open(encoding="utf-8") as handle:
                  profile = json.load(handle)
              if profile.get("dataset") != dataset:
                  raise SystemExit(f"dataset mismatch: {dataset}")
              profiles.append(profile)

          total_records = sum(item["total_rows"] for item in profiles)
          total_blobs = sum(item["total_blobs"] for item in profiles)
          total_operations = sum(len(item["operations"]) for item in profiles)
          if total_records != 24_073_651:
              raise SystemExit(f"record mismatch: {total_records}")
          if total_blobs != 4_228:
              raise SystemExit(f"blob mismatch: {total_blobs}")
          if total_operations != 52:
              raise SystemExit(f"operation mismatch: {total_operations}")

          for profile in profiles:
              for operation, stats in profile["operations"].items():
                  if stats["malformed_json_lines"] != 0:
                      raise SystemExit(f"malformed JSON: {profile['dataset']}/{operation}")
                  if stats["invalid_payloads"] != 0:
                      raise SystemExit(f"invalid payload: {profile['dataset']}/{operation}")
                  if stats["basdt_missing"] != 0 or stats["basdt_invalid"] != 0:
                      raise SystemExit(f"invalid basDt: {profile['dataset']}/{operation}")

          lines = [
              "# Raw Profile Index",
              "",
              "> Azure Blob canonical Raw 전수 프로파일링 결과. JSON은 기계 판독용 전체 통계이고 Markdown은 사람이 검토하기 위한 상세 리포트다.",
              "",
              "| dataset | operations | blobs | records | compressed bytes |",
              "|---|---:|---:|---:|---:|",
          ]
          for profile in profiles:
              lines.append(
                  f"| `{profile['dataset']}` | {len(profile['operations'])} | "
                  f"{profile['total_blobs']:,} | {profile['total_rows']:,} | "
                  f"{profile['compressed_bytes']:,} |"
              )
          lines.extend(
              [
                  "",
                  f"- total datasets: **{len(profiles)}**",
                  f"- total operations: **{total_operations}**",
                  f"- total blobs: **{total_blobs:,}**",
                  f"- total records: **{total_records:,}**",
                  "",
                  "## 결측 통계 해석",
                  "",
                  "- `missing`: 해당 payload에 key 자체가 없는 행 수",
                  "- `null`: JSON null 값인 행 수",
                  "- `empty`: 빈 문자열인 행 수",
                  "- `null_or_empty_rate`: 존재하는 필드 값 중 null/빈 문자열 비율",
                  "- 높은 결측률은 곧 오류라는 뜻이 아니며 operation의 구조적 특성과 함께 해석한다.",
                  "",
                  "기준 실행: GitHub Actions `31932890997` (2026-08-16).",
              ]
          )
          (root / "INDEX.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"verified datasets={len(profiles)} operations={total_operations} blobs={total_blobs} records={total_records}")
          PY

      - name: Check that no obvious secrets are present
        run: |
          set -euo pipefail
          if grep -RIE 'AccountKey=|SharedAccessSignature=|gh[pousr]_[A-Za-z0-9_]{20,}|password[[:space:]]*[:=]' data/reports/raw-profile; then
            echo "Potential secret-like value found in profile output"
            exit 1
          fi

      - name: Commit exact profile artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/raw-profile
          git diff --cached --stat
          git commit -m "docs(data): add detailed Raw profiles (#35)"
          git push origin HEAD:docs/35-raw-profile-artifacts
