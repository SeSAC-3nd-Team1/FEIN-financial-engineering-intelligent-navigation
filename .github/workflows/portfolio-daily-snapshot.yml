name: Portfolio Daily Snapshot

on:
  schedule:
    # KRX 장 마감 이후 평일 19:00 KST에 활성 계좌를 평가한다.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate settings
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL GitHub Secret is required." >&2
            exit 1
          fi

      - name: Capture portfolio snapshots
        working-directory: backend
        run: python -m app.scripts.capture_portfolio_snapshots
