name: Data Unit Tests

on:
  push:
    branches:
      - chore/20-data-layer-operations
    paths:
      - "data/**"
      - ".github/workflows/data-unit-tests.yml"
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/data-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt

      - name: Run data unit tests
        run: python -m pytest tests -q
