name: Backend Integration Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "data/db/**"
      - "data/scripts/init_local_db.py"
      - "data/scripts/seed_signup_terms.py"
      - "compose.yaml"
      - ".github/workflows/backend-integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sesac
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-integration-secret
      RUN_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sesac
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sesac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            data/requirements.txt
            data/requirements-db-init.txt

      - name: Install dependencies
        run: python -m pip install -r data/requirements.txt -r backend/requirements.txt

      - name: Apply migrations and seed test terms twice
        working-directory: data
        run: |
          alembic upgrade head
          python -m scripts.seed_signup_terms --version ci-e2e --effective-at 2026-08-23T00:00:00+00:00
          python -m scripts.seed_signup_terms --version ci-e2e --effective-at 2026-08-23T00:00:00+00:00
          alembic check

      - name: Run Backend unit and E2E tests
        working-directory: backend
        run: pytest -q
