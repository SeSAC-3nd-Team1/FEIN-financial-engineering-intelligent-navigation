name: Azure Live Storage Audit

on:
  workflow_dispatch:
  schedule:
    # 매일 10:00 KST에 실제 Blob/PostgreSQL 상태를 점검한다.
    - cron: "0 1 * * *"
  push:
    branches:
      - develop
    paths:
      - data/scripts/audit_live_stores.py
      - .github/workflows/azure-live-storage-audit.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-live-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        id: azure_login
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Diagnose Azure CLI and Blob data-plane access
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.azure_login.outcome }}" == "success" ]]; then
            echo "AZURE_LOGIN_OK=true" >> "${GITHUB_ENV}"
          else
            echo "AZURE_LOGIN_OK=false" >> "${GITHUB_ENV}"
          fi

          if az account get-access-token --resource https://storage.azure.com/ --output none >/dev/null 2>&1; then
            echo "AZURE_TOKEN_ACQUISITION_OK=true" >> "${GITHUB_ENV}"
          else
            echo "AZURE_TOKEN_ACQUISITION_OK=false" >> "${GITHUB_ENV}"
          fi

          if az storage container list \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --auth-mode login \
            --num-results 1 \
            --output none >/dev/null 2>&1; then
            echo "BLOB_CLI_DATA_PLANE_OK=true" >> "${GITHUB_ENV}"
          else
            echo "BLOB_CLI_DATA_PLANE_OK=false" >> "${GITHUB_ENV}"
          fi

          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL is not configured; PostgreSQL diagnostics will report it safely." >&2
          fi

      - name: Audit live Blob and PostgreSQL stores
        id: live_audit
        continue-on-error: true
        working-directory: data
        run: python -m scripts.audit_live_stores

      - name: Publish audit to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/reports/AZURE_LIVE_AUDIT.md ]]; then
            cat data/reports/AZURE_LIVE_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-live-storage-audit
          path: |
            data/reports/AZURE_LIVE_AUDIT.md
            data/reports/azure_live_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce live audit result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.live_audit.outcome }}" != "success" ]]; then
            echo "One or more live store audits failed. See Job Summary and artifact." >&2
            exit 1
          fi
