name: Azure Live Storage Audit

on:
  workflow_dispatch:
  schedule:
    # 매일 10:00 KST에 실제 Blob/PostgreSQL 상태를 점검한다.
    - cron: "0 1 * * *"
  push:
    branches:
      - develop
    paths:
      - data/scripts/audit_live_stores.py
      - .github/workflows/azure-live-storage-audit.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-live-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Validate required connection settings
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL GitHub Secret is required." >&2
            exit 1
          fi

      - name: Audit live Blob and PostgreSQL stores
        working-directory: data
        run: python -m scripts.audit_live_stores

      - name: Publish audit to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/reports/AZURE_LIVE_AUDIT.md ]]; then
            cat data/reports/AZURE_LIVE_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-live-storage-audit
          path: |
            data/reports/AZURE_LIVE_AUDIT.md
            data/reports/azure_live_audit.json
          if-no-files-found: warn
          retention-days: 30
