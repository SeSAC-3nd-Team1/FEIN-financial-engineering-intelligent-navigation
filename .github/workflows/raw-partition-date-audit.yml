name: Raw Partition Date Audit

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          - disclosure
          - financial_statement
          - market_index
          - security_product
          - stock_dividend
          - stock_issuance
          - stock_master
          - stock_price
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt
      - name: Audit partition dates
        working-directory: data
        run: python scripts/audit_raw_partition_dates.py --dataset "${{ matrix.dataset }}"
