name: Raw Catalog Read-only Audit

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-catalog-readonly-audit.yml"

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Audit canonical Raw object metadata
        working-directory: data
        run: |
          python - <<'PY'
          import os
          import re
          from collections import Counter
          from storage.blob import BlobStorage

          pattern = re.compile(
              r"^data-go-kr/(?P<dataset>[^/]+)/operation=(?P<operation>[^/]+)/"
              r"year=(?P<year>\d{4})/month=(?P<month>\d{2})/[^/]+\.jsonl\.gz$"
          )
          required = {"content_sha256", "batch_hash", "record_count", "dataset", "operation", "source"}
          storage = BlobStorage.from_env()
          container = os.getenv("AZURE_STORAGE_CONTAINER_RAW", "raw")
          client = storage.service_client.get_container_client(container)
          objects = 0
          records = 0
          bytes_total = 0
          dataset_objects = Counter()
          dataset_records = Counter()
          errors = []

          for blob in client.list_blobs(name_starts_with="data-go-kr/", include=["metadata"]):
              objects += 1
              path = str(blob.name)
              match = pattern.match(path)
              if not match:
                  errors.append(f"noncanonical path: {path}")
                  continue
              metadata = dict(blob.metadata or {})
              missing = sorted(required - set(metadata))
              if missing:
                  errors.append(f"missing metadata {missing}: {path}")
                  continue
              if metadata["dataset"].lower() != match.group("dataset").lower():
                  errors.append(f"dataset mismatch: {path}")
              if metadata["operation"].lower() != match.group("operation").lower():
                  errors.append(f"operation mismatch: {path}")
              try:
                  count = int(metadata["record_count"])
              except ValueError:
                  errors.append(f"invalid record_count: {path}")
                  continue
              if count < 1:
                  errors.append(f"nonpositive record_count: {path}")
                  continue
              records += count
              bytes_total += int(blob.size or 0)
              dataset_objects[metadata["dataset"]] += 1
              dataset_records[metadata["dataset"]] += count

          if objects < 4228:
              errors.append(f"canonical object count regressed: {objects} < 4228")
          if errors:
              for error in errors[:50]:
                  print(f"ERROR {error}")
              raise SystemExit(f"Raw catalog audit failed: errors={len(errors)} objects={objects}")

          print(f"RAW CATALOG AUDIT OK objects={objects} records={records} bytes={bytes_total}")
          for dataset in sorted(dataset_objects):
              print(
                  f"DATASET {dataset} objects={dataset_objects[dataset]} "
                  f"records={dataset_records[dataset]}"
              )
          PY
