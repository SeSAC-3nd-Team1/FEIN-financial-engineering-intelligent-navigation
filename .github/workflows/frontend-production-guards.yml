name: Frontend Production Guards

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-production-guards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify normal production build succeeds
        working-directory: frontend
        run: npm run build

      - name: Verify production build rejects Mock backtest
        working-directory: frontend
        env:
          VITE_USE_MOCK_BACKTEST: "true"
        run: |
          if npm run build; then
            echo "Expected the production build to reject VITE_USE_MOCK_BACKTEST=true"
            exit 1
          fi

      - name: Build Frontend production image
        run: docker build -f frontend/Dockerfile.prod -t fein-frontend-prod-ci frontend

      - name: Verify Frontend production entrypoint
        run: |
          test "$(docker inspect --format '{{json .Config.Cmd}}' fein-frontend-prod-ci)" = '["/docker-entrypoint.sh"]'
