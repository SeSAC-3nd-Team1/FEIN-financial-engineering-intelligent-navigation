name: Loss Avoidance Daily Model and Rebalance

on:
  schedule:
    # KRX 장 마감 이후 평일 19:00 KST에 모델을 갱신하고 내부 계좌를 조정한다.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: loss-avoidance-daily
  cancel-in-progress: false

jobs:
  model-and-rebalance:
    runs-on: [self-hosted, Linux, X64, azure-large]
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BASE_URL: ${{ vars.KIS_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || 'stfeindata' }}
      AZURE_STORAGE_CONTAINER_FEATURES: ${{ vars.AZURE_STORAGE_CONTAINER_FEATURES || 'features' }}
      ALGORITHM_FEATURE_VERSION: ${{ vars.ALGORITHM_FEATURE_VERSION || '2' }}
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/ai:${{ github.workspace }}
      LOSS_AVOIDANCE_TOP_N: ${{ vars.LOSS_AVOIDANCE_TOP_N || '5' }}
      LOSS_AVOIDANCE_UNIVERSE_SIZE: ${{ vars.LOSS_AVOIDANCE_UNIVERSE_SIZE || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL REDIS_URL KIS_APP_KEY KIS_APP_SECRET AZURE_STORAGE_ACCOUNT_NAME; do
            [[ -n "${!name:-}" ]] || { echo "${name} is required." >&2; exit 1; }
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            backend/requirements.txt

      - name: Generate fix2 snapshot
        run: |
          set -euo pipefail
          python -m pip install -r ai/requirements.txt -r backend/requirements.txt
          mkdir -p .deploy-artifacts
          python -m inference.generate_loss_avoidance_snapshot \
            --algorithm-version "${ALGORITHM_FEATURE_VERSION}" \
            --top-n "${LOSS_AVOIDANCE_TOP_N}" \
            --universe-size "${LOSS_AVOIDANCE_UNIVERSE_SIZE}" \
            --output .deploy-artifacts/loss_avoidance_snapshot.json
          test -s .deploy-artifacts/loss_avoidance_snapshot.json

      - name: Rebalance internal PostgreSQL accounts
        working-directory: backend
        env:
          LOSS_AVOIDANCE_SNAPSHOT_PATH: ${{ github.workspace }}/.deploy-artifacts/loss_avoidance_snapshot.json
        run: python -m scripts.run_loss_avoidance_rebalance
