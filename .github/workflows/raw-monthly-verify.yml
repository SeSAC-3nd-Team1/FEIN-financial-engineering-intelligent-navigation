name: Raw Monthly Repartition Verify

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-monthly-verify.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: raw-monthly-repartition-verify
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          - disclosure
          - financial_statement
          - market_index
          - security_product
          - stock_dividend
          - stock_issuance
          - stock_master
          - stock_price
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Verify dataset byte-for-byte
        working-directory: data
        run: python scripts/verify_raw_monthly_repartition.py --dataset "${{ matrix.dataset }}"

  audit-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Audit Raw layout
        working-directory: data
        run: python scripts/verify_raw_monthly_repartition.py --audit-layout

  summary:
    needs:
      - verify
      - audit-layout
    runs-on: ubuntu-latest
    steps:
      - name: Verification summary
        run: |
          echo "All 8 dataset verifiers passed."
          echo "Verified expected total records: 24,070,779"
          echo "Migration source blobs: 525"
          echo "No source blobs were modified or deleted."
