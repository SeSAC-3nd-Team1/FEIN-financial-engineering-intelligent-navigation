name: Frontend Color Token Guardrail

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-color-guardrail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-raw-colors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check:colors
