name: Raw Monthly Repartition Full

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-monthly-repartition.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: raw-monthly-repartition-full
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Run Raw unit tests
        working-directory: data
        run: python -m pytest tests/test_blob_storage.py tests/test_public_data.py -q

  repartition:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          - disclosure
          - financial_statement
          - market_index
          - security_product
          - stock_dividend
          - stock_issuance
          - stock_master
          - stock_price
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Repartition existing Raw blobs for dataset
        working-directory: data
        run: python scripts/repartition_existing_raw_blobs.py --dataset "${{ matrix.dataset }}"
