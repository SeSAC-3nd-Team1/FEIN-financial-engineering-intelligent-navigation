name: KRX Daily Sync

on:
  schedule:
    # KRX 장 마감과 원천 데이터 게시 시간을 고려해 평일 18:30 KST에 실행한다.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      base_date:
        description: "동기화할 KRX 기준일(YYYY-MM-DD, 비우면 UTC 오늘)"
        required: false
        type: string
      start_date:
        description: "과거 백필 시작일(YYYY-MM-DD, end_date와 함께 사용)"
        required: false
        type: string
      end_date:
        description: "과거 백필 종료일(YYYY-MM-DD, start_date와 함께 사용)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: krx-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    # Historical backfills are long-running and must use the same self-hosted
    # Azure runner used by production deployment, so they do not depend on
    # GitHub-hosted runner billing or a separate network path to PostgreSQL.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      KRX_BASE_URL: https://data-dbg.krx.co.kr/svc/apis
      KRX_TIMEOUT_SECONDS: "10"
      PYTHONPATH: .
      REQUESTED_BASE_DATE: ${{ github.event.inputs.base_date || '' }}
      REQUESTED_START_DATE: ${{ github.event.inputs.start_date || '' }}
      REQUESTED_END_DATE: ${{ github.event.inputs.end_date || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Validate settings and resolve base date
        id: settings
        shell: bash
        run: |
          if [[ -z "${KRX_AUTH_KEY}" || -z "${DATABASE_URL}" ]]; then
            echo "KRX_AUTH_KEY and DATABASE_URL GitHub Secrets are required." >&2
            exit 1
          fi
          if [[ -n "${REQUESTED_START_DATE}" || -n "${REQUESTED_END_DATE}" ]]; then
            if [[ -n "${REQUESTED_BASE_DATE}" || -z "${REQUESTED_START_DATE}" || -z "${REQUESTED_END_DATE}" ]]; then
              echo "start_date and end_date must be provided together without base_date." >&2
              exit 1
            fi
            if ! [[ "${REQUESTED_START_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "${REQUESTED_END_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "start_date and end_date must use YYYY-MM-DD." >&2
              exit 1
            fi
            echo "mode=range" >> "${GITHUB_OUTPUT}"
            echo "start_date=${REQUESTED_START_DATE}" >> "${GITHUB_OUTPUT}"
            echo "end_date=${REQUESTED_END_DATE}" >> "${GITHUB_OUTPUT}"
          else
            base_date="${REQUESTED_BASE_DATE:-$(date -u +%F)}"
            if ! [[ "${base_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "base_date must use YYYY-MM-DD." >&2
              exit 1
            fi
            echo "mode=single" >> "${GITHUB_OUTPUT}"
            echo "base_date=${base_date}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Sync approved KRX datasets
        working-directory: data
        shell: bash
        run: |
          if [[ "${{ steps.settings.outputs.mode }}" == "range" ]]; then
            python -m scripts.sync_krx \
              --start-date "${{ steps.settings.outputs.start_date }}" \
              --end-date "${{ steps.settings.outputs.end_date }}"
          else
            python -m scripts.sync_krx --date "${{ steps.settings.outputs.base_date }}"
          fi
