name: Raw Monthly Repartition Smoke

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-monthly-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Check required secret
        shell: bash
        run: |
          test -n "$AZURE_STORAGE_CONNECTION_STRING" || { echo "Missing GitHub secret: AZURE_STORAGE_CONNECTION_STRING"; exit 1; }

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Run Raw unit tests
        working-directory: data
        run: python -m pytest tests/test_blob_storage.py tests/test_public_data.py -q

      - name: Repartition one existing real Raw blob
        working-directory: data
        run: |
          python scripts/repartition_existing_raw_blobs.py \
            --dataset stock_price \
            --operation getStockPriceInfo \
            --max-source-blobs 1
