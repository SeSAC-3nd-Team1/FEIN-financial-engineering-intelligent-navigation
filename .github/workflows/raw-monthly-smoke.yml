name: Raw Monthly Repartition Smoke

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - ".github/workflows/raw-monthly-smoke.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT_NAME: stfeindata
      AZURE_STORAGE_CONTAINER_RAW: raw
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure OIDC settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "Missing GitHub secret: AZURE_CLIENT_ID"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Missing GitHub secret: AZURE_TENANT_ID"; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "Missing GitHub secret: AZURE_SUBSCRIPTION_ID"; exit 1; }
          test "$AZURE_CLIENT_ID" = "62df74c5-7dc4-4b2e-9014-a37b09b5a7bd" || { echo "AZURE_CLIENT_ID does not match azure-github-chatgpt-mg"; exit 1; }
          test "$AZURE_TENANT_ID" = "f2d17c51-f5c8-4e25-a029-7fee401686c2" || { echo "AZURE_TENANT_ID does not match azure-github-chatgpt-mg"; exit 1; }
          test "$AZURE_SUBSCRIPTION_ID" = "b5a82513-0077-4885-a2d3-6aa00c3cac5b" || { echo "AZURE_SUBSCRIPTION_ID does not match azure-github-chatgpt-mg"; exit 1; }
          echo "Azure OIDC IDs match azure-github-chatgpt-mg."

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Run Raw unit tests
        working-directory: data
        run: python -m pytest tests/test_blob_storage.py tests/test_public_data.py -q

      - name: Repartition one existing real Raw blob
        working-directory: data
        run: |
          python scripts/repartition_existing_raw_blobs.py \
            --dataset stock_price \
            --operation getStockPriceInfo \
            --max-source-blobs 1
