name: Raw Monthly Repartition Smoke

on:
  push:
    branches:
      - fix/18-raw-monthly-partition
    paths:
      - "data/**"
      - ".github/workflows/raw-monthly-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_RAW: raw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing GitHub secret: DATABASE_URL"; exit 1; }
          test -n "$AZURE_STORAGE_CONNECTION_STRING" || { echo "Missing GitHub secret: AZURE_STORAGE_CONNECTION_STRING"; exit 1; }

      - name: Install data dependencies
        run: python -m pip install -r data/requirements.txt

      - name: Run Raw unit tests
        working-directory: data
        run: python -m pytest tests/test_blob_storage.py tests/test_public_data.py -q

      - name: Repartition one real January 2026 stock-price chunk
        working-directory: data
        run: |
          python scripts/migrate_public_data_raw_to_blob.py \
            --dataset stock_price \
            --operation getStockPriceInfo \
            --month 2026-01 \
            --chunk-size 50000 \
            --max-chunks 1
