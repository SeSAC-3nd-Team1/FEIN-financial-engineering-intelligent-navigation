name: sesac-team1

services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_WEBSOCKET_URL: ${KIS_WEBSOCKET_URL:-ws://ops.koreainvestment.com:21000}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-3}
      PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-5}
      REALTIME_PRICE_CACHE_TTL_SECONDS: ${REALTIME_PRICE_CACHE_TTL_SECONDS:-30}
      REALTIME_PRICE_STALE_SECONDS: ${REALTIME_PRICE_STALE_SECONDS:-10}
      KIS_REALTIME_RECONNECT_MAX_SECONDS: ${KIS_REALTIME_RECONNECT_MAX_SECONDS:-30}
      KIS_REALTIME_CLIENT_QUEUE_SIZE: ${KIS_REALTIME_CLIENT_QUEUE_SIZE:-100}
      KIS_REALTIME_MAX_SYMBOLS_PER_CLIENT: ${KIS_REALTIME_MAX_SYMBOLS_PER_CLIENT:-20}
      NAVER_API_HUB_CLIENT_ID: ${NAVER_API_HUB_CLIENT_ID:-}
      NAVER_API_HUB_CLIENT_SECRET: ${NAVER_API_HUB_CLIENT_SECRET:-}
      NAVER_NEWS_BASE_URL: ${NAVER_NEWS_BASE_URL:-https://naverapihub.apigw.ntruss.com}
      NEWS_SEARCH_QUERY: ${NEWS_SEARCH_QUERY:-증시}
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-300}
      NEWS_REQUEST_TIMEOUT_SECONDS: ${NEWS_REQUEST_TIMEOUT_SECONDS:-5}
      VIRTUAL_ACCOUNT_INITIAL_CASH: ${VIRTUAL_ACCOUNT_INITIAL_CASH:-10000000}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-init:
    build:
      context: ./data
      dockerfile: Dockerfile.db-init
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      SIGNUP_TERMS_VERSION: ${SIGNUP_TERMS_VERSION:-dev-20260823}
      SIGNUP_TERMS_EFFECTIVE_AT: ${SIGNUP_TERMS_EFFECTIVE_AT:-2026-08-23T00:00:00+09:00}
      SIGNUP_TERMS_CONTENT_BASE_URL: ${SIGNUP_TERMS_CONTENT_BASE_URL:-}
      DB_INIT_MAX_ATTEMPTS: ${DB_INIT_MAX_ATTEMPTS:-30}
      DB_INIT_RETRY_SECONDS: ${DB_INIT_RETRY_SECONDS:-2}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
    volumes:
      - ./data:/app
    command: ["python", "-m", "scripts.init_local_db"]
    restart: "no"

  data:
    build:
      context: ./data
    profiles:
      - data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_RAW: ${AZURE_STORAGE_CONTAINER_RAW:-raw}
      AZURE_STORAGE_CONTAINER_PROCESSED: ${AZURE_STORAGE_CONTAINER_PROCESSED:-processed}
      AZURE_STORAGE_CONTAINER_FEATURES: ${AZURE_STORAGE_CONTAINER_FEATURES:-features}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    volumes:
      - ./data:/app
      - azure_cli_data:/root/.azure
    depends_on:
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  ai:
    build:
      context: ./ai
    profiles:
      - ai
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./ai:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
  azure_cli_data:
