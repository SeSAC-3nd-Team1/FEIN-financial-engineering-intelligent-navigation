name: sesac-team1

services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_MOCK_BACKTEST: ${VITE_USE_MOCK_BACKTEST:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AI_PROFILE_TIMEOUT_SECONDS: ${AI_PROFILE_TIMEOUT_SECONDS:-15}
      AI_PROFILE_MODEL_VERSION: ${AI_PROFILE_MODEL_VERSION:-investor-profile-v1}
      AI_PROFILE_PROMPT_VERSION: ${AI_PROFILE_PROMPT_VERSION:-v1}
      AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT: ${AZURE_OPENAI_RECOMMENDATION_DEPLOYMENT:-}
      AI_RECOMMENDATION_TIMEOUT_SECONDS: ${AI_RECOMMENDATION_TIMEOUT_SECONDS:-15}
      AI_RECOMMENDATION_MODEL_VERSION: ${AI_RECOMMENDATION_MODEL_VERSION:-strategy-recommender-v1}
      AI_RECOMMENDATION_PROMPT_VERSION: ${AI_RECOMMENDATION_PROMPT_VERSION:-v1}
      AI_RECOMMENDATION_DATASET_VERSION: ${AI_RECOMMENDATION_DATASET_VERSION:-financial-8y-v1}
      AZURE_OPENAI_REBALANCING_DEPLOYMENT: ${AZURE_OPENAI_REBALANCING_DEPLOYMENT:-}
      AI_REBALANCING_TIMEOUT_SECONDS: ${AI_REBALANCING_TIMEOUT_SECONDS:-15}
      AI_REBALANCING_MODEL_VERSION: ${AI_REBALANCING_MODEL_VERSION:-rebalancing-v1}
      AZURE_OPENAI_COMPARISON_DEPLOYMENT: ${AZURE_OPENAI_COMPARISON_DEPLOYMENT:-}
      AI_COMPARISON_TIMEOUT_SECONDS: ${AI_COMPARISON_TIMEOUT_SECONDS:-15}
      AI_COMPARISON_MODEL_VERSION: ${AI_COMPARISON_MODEL_VERSION:-portfolio-comparison-v1}
      AZURE_OPENAI_CHATBOT_ENDPOINT: ${AZURE_OPENAI_CHATBOT_ENDPOINT:-}
      AZURE_OPENAI_CHATBOT_API_KEY: ${AZURE_OPENAI_CHATBOT_API_KEY:-}
      AZURE_OPENAI_CHATBOT_DEPLOYMENT: ${AZURE_OPENAI_CHATBOT_DEPLOYMENT:-}
      AZURE_OPENAI_CHATBOT_API_VERSION: ${AZURE_OPENAI_CHATBOT_API_VERSION:-2024-10-21}
      AI_CHATBOT_TIMEOUT_SECONDS: ${AI_CHATBOT_TIMEOUT_SECONDS:-30}
      AI_CHATBOT_MODEL_VERSION: ${AI_CHATBOT_MODEL_VERSION:-chatbot-v1}
      AI_CHATBOT_PROMPT_VERSION: ${AI_CHATBOT_PROMPT_VERSION:-v1}
      MODEL_RECOMMENDATION_SNAPSHOT_PATH: ${MODEL_RECOMMENDATION_SNAPSHOT_PATH:-/model-artifacts/model_recommendation_snapshot.json}
      LOSS_AVOIDANCE_SNAPSHOT_PATH: ${LOSS_AVOIDANCE_SNAPSHOT_PATH:-/model-artifacts/loss_avoidance_snapshot.json}
      MODEL_RECOMMENDATION_ALLOW_FALLBACK: ${MODEL_RECOMMENDATION_ALLOW_FALLBACK:-true}
      MODEL_RECOMMENDATION_STALE_AFTER_DAYS: ${MODEL_RECOMMENDATION_STALE_AFTER_DAYS:-3}
      STRATEGY_CATALOG_VERSION: ${STRATEGY_CATALOG_VERSION:-v2}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_WEBSOCKET_URL: ${KIS_WEBSOCKET_URL:-ws://ops.koreainvestment.com:21000}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-3}
      KIS_REST_PAGE_INTERVAL_SECONDS: ${KIS_REST_PAGE_INTERVAL_SECONDS:-0.5}
      PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-5}
      MINUTE_CANDLE_CACHE_TTL_SECONDS: ${MINUTE_CANDLE_CACHE_TTL_SECONDS:-15}
      REALTIME_PRICE_CACHE_TTL_SECONDS: ${REALTIME_PRICE_CACHE_TTL_SECONDS:-30}
      REALTIME_PRICE_STALE_SECONDS: ${REALTIME_PRICE_STALE_SECONDS:-10}
      KIS_REALTIME_RECONNECT_MAX_SECONDS: ${KIS_REALTIME_RECONNECT_MAX_SECONDS:-30}
      KIS_REALTIME_CLIENT_QUEUE_SIZE: ${KIS_REALTIME_CLIENT_QUEUE_SIZE:-100}
      KIS_REALTIME_MAX_SYMBOLS_PER_CLIENT: ${KIS_REALTIME_MAX_SYMBOLS_PER_CLIENT:-20}
      NAVER_API_HUB_CLIENT_ID: ${NAVER_API_HUB_CLIENT_ID:-}
      NAVER_API_HUB_CLIENT_SECRET: ${NAVER_API_HUB_CLIENT_SECRET:-}
      NAVER_NEWS_BASE_URL: ${NAVER_NEWS_BASE_URL:-https://naverapihub.apigw.ntruss.com}
      NEWS_SEARCH_QUERY: ${NEWS_SEARCH_QUERY:-증시}
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-300}
      NEWS_REQUEST_TIMEOUT_SECONDS: ${NEWS_REQUEST_TIMEOUT_SECONDS:-5}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ACS_EMAIL_CONNECTION_STRING: ${ACS_EMAIL_CONNECTION_STRING:-}
      ACS_EMAIL_SENDER_ADDRESS: ${ACS_EMAIL_SENDER_ADDRESS:-}
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:-}
      EMAIL_OTP_TTL_SECONDS: ${EMAIL_OTP_TTL_SECONDS:-300}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      EMAIL_OTP_RESEND_SECONDS: ${EMAIL_OTP_RESEND_SECONDS:-60}
      EMAIL_OTP_HOURLY_LIMIT: ${EMAIL_OTP_HOURLY_LIMIT:-5}
      EMAIL_OTP_IP_HOURLY_LIMIT: ${EMAIL_OTP_IP_HOURLY_LIMIT:-20}
      EMAIL_VERIFICATION_TOKEN_TTL_SECONDS: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:-1800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WATCHFILES_FORCE_POLLING: "true"
      FINCON_VER23_MODEL_PATH: /models/fincon_ver23_model_fix.py
      MBG_COORDINATOR_ENDPOINT: ${MBG_COORDINATOR_ENDPOINT:-https://fein-agent.services.ai.azure.com/api/projects/proj-default/agents/MBGCoordinator/endpoint/protocols/openai/responses}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./output:/models:ro
      - model_recommendation_artifacts:/model-artifacts:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-init:
    build:
      context: ./data
      dockerfile: Dockerfile.db-init
    profiles:
      - migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SIGNUP_TERMS_VERSION: ${SIGNUP_TERMS_VERSION:-dev-20260823}
      SIGNUP_TERMS_EFFECTIVE_AT: ${SIGNUP_TERMS_EFFECTIVE_AT:-2026-08-23T00:00:00+09:00}
      SIGNUP_TERMS_CONTENT_BASE_URL: ${SIGNUP_TERMS_CONTENT_BASE_URL:-}
      INVESTMENT_TERMS_VERSION: ${INVESTMENT_TERMS_VERSION:-dev-20260824}
      INVESTMENT_TERMS_EFFECTIVE_AT: ${INVESTMENT_TERMS_EFFECTIVE_AT:-2026-08-24T00:00:00+09:00}
      INVESTMENT_TERMS_CONTENT_BASE_URL: ${INVESTMENT_TERMS_CONTENT_BASE_URL:-}
      DB_INIT_MAX_ATTEMPTS: ${DB_INIT_MAX_ATTEMPTS:-30}
      DB_INIT_RETRY_SECONDS: ${DB_INIT_RETRY_SECONDS:-2}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
    volumes:
      - ./data:/app
    command: ["python", "-m", "scripts.init_local_db"]
    restart: "no"

  data:
    build:
      context: ./data
    profiles:
      - data
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
      KRX_AUTH_KEY: ${KRX_AUTH_KEY:-}
      KRX_BASE_URL: ${KRX_BASE_URL:-https://data-dbg.krx.co.kr/svc/apis}
      KRX_TIMEOUT_SECONDS: ${KRX_TIMEOUT_SECONDS:-10}
      KRX_MAX_CONCURRENCY: ${KRX_MAX_CONCURRENCY:-4}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      OPENDART_TIMEOUT_SECONDS: ${OPENDART_TIMEOUT_SECONDS:-10}
      OPENDART_MAX_CONCURRENCY: ${OPENDART_MAX_CONCURRENCY:-1}
      OPENDART_MIN_INTERVAL_SECONDS: ${OPENDART_MIN_INTERVAL_SECONDS:-0.25}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      ECOS_TIMEOUT_SECONDS: ${ECOS_TIMEOUT_SECONDS:-10}
      ECOS_MAX_CONCURRENCY: ${ECOS_MAX_CONCURRENCY:-2}
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_RAW: ${AZURE_STORAGE_CONTAINER_RAW:-raw}
      AZURE_STORAGE_CONTAINER_PROCESSED: ${AZURE_STORAGE_CONTAINER_PROCESSED:-processed}
      AZURE_STORAGE_CONTAINER_FEATURES: ${AZURE_STORAGE_CONTAINER_FEATURES:-features}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      BLOB_UPLOAD_MAX_CONCURRENCY: ${BLOB_UPLOAD_MAX_CONCURRENCY:-4}
      MODEL_RAW_CHECKPOINT_EVERY: ${MODEL_RAW_CHECKPOINT_EVERY:-5}
    volumes:
      - ./data:/app
      - azure_cli_data:/root/.azure
    depends_on:
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  ai:
    build:
      context: ./ai
    profiles:
      - ai
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_FEATURES: ${AZURE_STORAGE_CONTAINER_FEATURES:-features}
      MODEL_RECOMMENDATION_SNAPSHOT_PATH: ${MODEL_RECOMMENDATION_SNAPSHOT_PATH:-/model-artifacts/model_recommendation_snapshot.json}
      LOSS_AVOIDANCE_SNAPSHOT_PATH: ${LOSS_AVOIDANCE_SNAPSHOT_PATH:-/model-artifacts/loss_avoidance_snapshot.json}
      ALGORITHM_V23_PATH: /algorithm-output/Algorithm(ver.2.3).py
    volumes:
      - ./ai:/app
      - ./output:/algorithm-output:ro
      - model_recommendation_artifacts:/model-artifacts
      - azure_cli_data:/root/.azure
    depends_on:
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  recommendation-generator:
    build:
      context: ./ai
    profiles:
      - ai
    environment:
      PYTHONPATH: /app
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_FEATURES: ${AZURE_STORAGE_CONTAINER_FEATURES:-features}
      MODEL_RECOMMENDATION_SNAPSHOT_PATH: ${MODEL_RECOMMENDATION_SNAPSHOT_PATH:-/model-artifacts/model_recommendation_snapshot.json}
    volumes:
      - ./ai:/app
      - model_recommendation_artifacts:/model-artifacts
      - azure_cli_data:/root/.azure
    command:
      - python
      - -m
      - inference.generate_latest_recommendations
      - --model-version
      - ${MODEL_FEATURE_VERSION:-2}
      - --algorithm-version
      - ${ALGORITHM_FEATURE_VERSION:-2}
      - --master-version
      - ${SECURITY_MASTER_FEATURE_VERSION:-1}
      - --top-n
      - ${MODEL_RECOMMENDATION_TOP_N:-5}
    restart: "no"

  loss-avoidance-generator:
    build:
      context: ./ai
    profiles:
      - ai
    environment:
      PYTHONPATH: /app
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER_FEATURES: ${AZURE_STORAGE_CONTAINER_FEATURES:-features}
      LOSS_AVOIDANCE_SNAPSHOT_PATH: ${LOSS_AVOIDANCE_SNAPSHOT_PATH:-/model-artifacts/loss_avoidance_snapshot.json}
      ALGORITHM_V23_PATH: /algorithm-output/Algorithm(ver.2.3).py
    volumes:
      - ./ai:/app
      - ./output:/algorithm-output:ro
      - model_recommendation_artifacts:/model-artifacts
      - azure_cli_data:/root/.azure
    command:
      - python
      - -m
      - inference.generate_loss_avoidance_snapshot
      - --algorithm-version
      - ${ALGORITHM_FEATURE_VERSION:-2}
      - --top-n
      - ${LOSS_AVOIDANCE_TOP_N:-5}
      - --universe-size
      - ${LOSS_AVOIDANCE_UNIVERSE_SIZE:-20}
    restart: "no"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  redis_data:
  azure_cli_data:
  model_recommendation_artifacts:
